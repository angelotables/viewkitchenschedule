<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Gyro City — Kitchen Schedule</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23FFF7EC'/><text x='50' y='66' font-size='46' text-anchor='middle'>🔪</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FFF9F1; --card:#FFFFFF; --ink:#2E2A26; --soft:#8D8378; --line:#EFE4D4;
    --olive:#5E8C5E; --cook:#6B579B; --prep:#C77518; --navy:#22456B; --tomato:#C0442E;
    --disp:'Space Grotesk',sans-serif; --sans:'Inter',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;
    background-image:radial-gradient(700px 400px at 100% -10%,rgba(199,117,24,.08),transparent 60%),
      radial-gradient(600px 400px at -10% 100%,rgba(107,87,155,.07),transparent 60%);background-attachment:fixed}
  .wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
  h1{font-family:var(--disp);font-size:24px;margin:0;font-weight:700}
  .sub{font-size:12px;color:var(--soft);letter-spacing:.12em;font-weight:600;margin-top:2px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .seg{display:flex;background:#F4EADB;border-radius:14px;padding:4px;margin:14px 0 10px}
  .seg button{flex:1;border:none;background:transparent;border-radius:11px;padding:11px;font-family:var(--disp);
    font-size:14px;font-weight:600;color:var(--soft);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px -4px rgba(46,42,38,.25)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 14px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;
    color:var(--soft);cursor:pointer;font-family:var(--sans)}
  .chip.on{border-color:var(--ink);color:var(--ink)}
  .daycard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:11px;
    box-shadow:0 4px 16px -8px rgba(46,42,38,.15)}
  .daycard.today{border-color:var(--olive);box-shadow:0 0 0 1.5px var(--olive),0 4px 16px -8px rgba(46,42,38,.15)}
  .dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .dh b{font-family:var(--disp);font-size:16.5px}
  .dh .dd{font-size:11.5px;color:var(--soft);font-weight:600}
  .today-tag{font-size:10px;letter-spacing:.14em;color:var(--olive);font-weight:800}
  .roleh{font-size:10px;letter-spacing:.18em;font-weight:800;margin:8px 0 5px}
  .sh{display:flex;justify-content:space-between;padding:7px 10px;border-radius:10px;margin-bottom:5px;font-size:14.5px;background:#FAF5EC}
  .sh b{font-weight:600}
  .sh .t{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--navy);font-weight:700}
  .sh.me{background:#E7F0E7;box-shadow:inset 0 0 0 1.5px var(--olive)}
  .off{color:#C4B8A8;font-size:13px;font-style:italic;padding:2px 10px 4px}
  .empty{text-align:center;color:#B9AD9C;padding:36px 12px;line-height:1.7;font-size:14.5px}
  .banner{background:#FBEFE0;border:1px solid #EDD9BC;border-radius:14px;padding:12px 15px;font-size:13.5px;color:#7A5A28;margin-bottom:14px;line-height:1.5}
  .foot{text-align:center;color:#C4B8A8;font-size:11.5px;margin-top:18px;line-height:1.7}
  /* ---- sign-in ---- */
  .lcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;margin-top:16px;
    box-shadow:0 10px 30px -14px rgba(46,42,38,.28)}
  .whoami{text-align:center;font-family:var(--disp);font-size:20px;font-weight:700;margin-bottom:4px}
  .pinsub{text-align:center;font-size:13.5px;color:var(--soft);margin-bottom:16px;line-height:1.55}
  .namegrid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .namegrid .chip{padding:12px 17px;font-size:15px}
  .dots{display:flex;gap:15px;justify-content:center;margin:6px 0 20px}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:all .15s cubic-bezier(.5,1.6,.5,1)}
  .dot.f{background:var(--olive);border-color:transparent;transform:scale(1.18)}
  .dots.bad .dot{border-color:var(--tomato);background:#F7E5E1;animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:282px;margin:0 auto}
  .key{border:1px solid var(--line);border-radius:16px;background:#FAF5EC;color:var(--ink);font-size:23px;font-weight:600;padding:16px 0;
    cursor:pointer;font-family:var(--disp)}
  .key:active{transform:scale(.94);background:#F1E7D6}
  .key.ghostk{background:transparent;border-color:transparent;font-size:17px;color:var(--soft)}
  .linkb{background:none;border:none;color:var(--navy);font-weight:700;font-size:13.5px;cursor:pointer;font-family:var(--sans)}
  .errline{color:var(--tomato);font-weight:700;font-size:13px;text-align:center;margin-top:10px}
  .logout{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:11.5px;
    font-weight:700;color:var(--soft);cursor:pointer;font-family:var(--sans)}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { h, render, Fragment } from 'https://esm.sh/preact@10.22.0';
import { useState, useEffect, useRef } from 'https://esm.sh/preact@10.22.0/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { initializeFirestore, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const html = htm.bind(h);

const firebaseConfig = {
  apiKey: "AIzaSyDzcydUg5xKt4G_5ECYkcW09eP80cOPIoA",
  authDomain: "gyro-city.firebaseapp.com",
  projectId: "gyro-city",
  storageBucket: "gyro-city.firebasestorage.app",
  messagingSenderId: "583218261960",
  appId: "1:583218261960:web:60b444a894fc2c0be69afd"
};
const fb=initializeApp(firebaseConfig);
const db=initializeFirestore(fb,{ experimentalForceLongPolling:true }); // survives store wifi with many devices
const D=(k)=>doc(db,'gyrocity',k);
const _auth=getAuth(fb);
// Same staff sign-in as the Staff Book: the 4-digit PIN is verified by Google,
// and first-time PINs are registered through the shared cloud function.
const FN_URL='https://staff-583218261960.us-east4.run.app';
const STAFF_EMAIL=(empId)=>empId+'@staff.gyrocity.app';
const STAFF_PW=(pin)=>'gc-'+pin+'-staff';

const SEED_EMP = [
  ['Angelo','cashier',0,'hr'],['Kaiya','cashier',0,'hr'],['Irene','cashier',0,'hr'],['Despoina','cashier',0,'hr'],['Isabelle','cashier',0,'hr'],['Christina','cashier',0,'hr'],['Francesca','cashier',0,'hr'],['Chris G','cashier',0,'hr'],
  ['Rafaela','expo',0,'hr'],['Daniel','expo',0,'hr'],['Michael','expo',0,'hr'],
  ['George','cook',0,'wk'],['Jimmy','cook',0,'hr'],['Sostis','cook',0,'wk'],['Kosta','cook',0,'wk'],['Theodoros','cook',0,'hr'],['Yianni','cook',0,'hr'],
  ['Joshua','prep',0,'hr'],['Eduardo','prep',0,'hr'],['Maykol','prep',0,'hr'],
  ['Alessandro','cashier',0,'hr'],['Mario','cashier',0,'hr'],['Ruben','cook',0,'hr'],  // appended — NEVER insert mid-list, IDs are positional
].map((e,i)=>({ id:'e'+i, name:e[0], role:e[1], rate:e[2], rateType:e[3] }));
const DAYS7=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const KITCHEN=[['cook','LINE COOKS','#6B579B'],['prep','PREP','#C77518']];
const fmtTime=(m)=>{if(m===24*60)return '12AM';let h2=Math.floor(m/60),mi=m%60;const ap=h2>=12&&h2<24?'PM':'AM';h2=h2%12||12;return `${h2}${mi?':'+String(mi).padStart(2,'0'):''}${ap}`;};
const mondayOf=(o=0)=>{const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+o*7);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const weekLabel=(m)=>{const[y,mo,d]=m.split('-').map(Number);const a=new Date(y,mo-1,d),b=new Date(y,mo-1,d+6);const f=(x)=>x.toLocaleDateString(undefined,{month:'short',day:'numeric'});return `${f(a)} – ${f(b)}`;};
const dayDate=(m,di)=>{const[y,mo,d]=m.split('-').map(Number);return new Date(y,mo-1,d+di).toLocaleDateString(undefined,{month:'short',day:'numeric'});};
const todayIdx=(m)=>{const[y,mo,d]=m.split('-').map(Number);const start=new Date(y,mo-1,d);const now=new Date();now.setHours(0,0,0,0);const diff=Math.round((now-start)/86400000);return diff>=0&&diff<7?diff:-1;};

function App(){
  const [store,setStore]=useState(localStorage.getItem('kit-store')||'astoria');
  const [offset,setOffset]=useState(0);
  const [week,setWeek]=useState(null);
  const [emp,setEmp]=useState(null);
  const [meName,setMeName]=useState(localStorage.getItem('kit-me')||'');
  const [stuck,setStuck]=useState(false);
  // sign-in
  const [authed,setAuthed]=useState(false);
  const [authReady,setAuthReady]=useState(false);
  const [loginName,setLoginName]=useState(null);
  const [pinBuf,setPinBuf]=useState('');
  const [pinMode,setPinMode]=useState('enter'); // enter | create | confirm
  const [firstPin,setFirstPin]=useState('');
  const [pinBad,setPinBad]=useState(false);
  const [authBusy,setAuthBusy]=useState(false);
  const [loginErr,setLoginErr]=useState('');
  const srvSeen=useRef({});
  const trustSnap=(key,s)=>{
    const fromCache=!!(s.metadata&&s.metadata.fromCache);
    if(fromCache&&srvSeen.current[key])return false;
    if(fromCache&&!s.exists())return false;
    if(!fromCache)srvSeen.current[key]=true;
    return true;
  };
  const monday=mondayOf(offset);
  useEffect(()=>{
    const un=onAuthStateChanged(_auth,(u)=>{ setAuthed(!!u&&!u.isAnonymous); setAuthReady(true); });
    return un;
  },[]);
  // The roster is public (names only) so the sign-in list works before logging in.
  useEffect(()=>{
    const u2=onSnapshot(D('emp_'+store),(s)=>{if(!trustSnap('emp_'+store,s))return;setEmp(s.exists()?(s.data().list||[]):SEED_EMP);},()=>{});
    return ()=>u2();
  },[store]);
  // The schedule itself needs a real staff login.
  useEffect(()=>{
    if(!authed){setWeek(null);return;}
    setWeek(null);
    const k=`week_${store}_${monday}`;
    const u1=onSnapshot(D(k),(s)=>{if(!trustSnap(k,s))return;setWeek(s.exists()?s.data():{shifts:[],published:false});},()=>{});
    return ()=>u1();
  },[store,monday,authed]);
  useEffect(()=>{const t=setTimeout(()=>{if(authed&&week===null)setStuck(true);},9000);if(week!==null)setStuck(false);return ()=>clearTimeout(t);},[week,store,monday,authed]);

  const idForName=(n2)=>((emp||SEED_EMP).find(e=>e.name===n2)||{}).id;
  function pressKey(k){
    if(authBusy)return;
    if(pinBad)setPinBad(false);
    // Functional update: fast taps can land in the same frame, so never read a stale buffer.
    setPinBuf(prev=>{
      if(k==='back')return prev.slice(0,-1);
      if(prev.length>=4)return prev;
      const nb=prev+k;
      if(nb.length===4)setTimeout(()=>submitPin(nb),120);
      return nb;
    });
  }
  async function submitPin(pin){
    const empId=idForName(loginName);
    if(!empId){setLoginErr('Could not find your name on the roster — ask a manager.');setPinBuf('');return;}
    if(pinMode==='create'){setFirstPin(pin);setPinMode('confirm');setPinBuf('');setPinBad(false);setLoginErr('');return;}
    if(pinMode==='confirm'){
      if(pin!==firstPin){setPinMode('create');setFirstPin('');setPinBuf('');setPinBad(true);setLoginErr("Those didn't match — pick your PIN again.");return;}
      setAuthBusy(true);setPinBad(false);setLoginErr('');
      try{
        const r=await fetch(FN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'register',empId,pin})});
        if(r.ok){ await signInWithEmailAndPassword(_auth,STAFF_EMAIL(empId),STAFF_PW(pin)); localStorage.setItem('kit-me',loginName); setMeName(loginName); }
        else if(r.status===409){ setPinMode('enter');setFirstPin('');setPinBuf('');setLoginErr('You already have a PIN — enter it below.'); }
        else { const j=await r.json().catch(()=>({})); setLoginErr(j.error||'Could not set your PIN.');setPinBuf('');setPinMode('create');setFirstPin(''); }
      }catch(e){ setLoginErr('Network problem — check your internet.');setPinBuf('');setPinMode('create');setFirstPin(''); }
      setAuthBusy(false);
      return;
    }
    setAuthBusy(true);setPinBad(false);setLoginErr('');
    try{
      await signInWithEmailAndPassword(_auth,STAFF_EMAIL(empId),STAFF_PW(pin));
      localStorage.setItem('kit-me',loginName); setMeName(loginName);
    }catch(e){ setPinBad(true);setPinBuf(''); }
    setAuthBusy(false);
  }
  function pickLogin(n2){ setLoginName(n2);setPinBuf('');setPinBad(false);setLoginErr('');setPinMode('enter');setFirstPin(''); }
  function logOut(){ signOut(_auth);setLoginName(null);setPinBuf('');setPinBad(false);setLoginErr('');setPinMode('enter');setFirstPin(''); }

  const empById=(id)=>(emp||[]).find(e=>e.id===id);
  const kitchenNames=[...new Set((emp||[]).filter(e=>e.role==='cook'||e.role==='prep').map(e=>e.name))];
  const tIdx=todayIdx(monday);
  const pickMe=(n)=>{const v=meName===n?'':n;setMeName(v);localStorage.setItem('kit-me',v);};
  const pickStore=(s2)=>{setStore(s2);localStorage.setItem('kit-store',s2);};

  const loaded=week!==null&&emp!==null;
  const published=loaded&&!!week.published;
  const kitchenShifts=(di,role)=>loaded?(week.shifts||[]).filter(s=>s.day===di&&s.position===role):[];

  if(!authReady){
    return html`<div class="wrap"><h1>🔪 Kitchen Schedule</h1><div class="empty">⏳ Connecting…</div></div>`;
  }
  if(!authed){
    const dots=[0,1,2,3].map(i=>html`<div class=${'dot'+(pinBuf.length>i?' f':'')} key=${i}></div>`);
    return html`
      <div class="wrap">
        <h1>🔪 Kitchen Schedule</h1>
        <div class="sub">GYRO CITY · KITCHEN CREW</div>
        <div class="lcard">
          ${!loginName?html`
            <div class="whoami">Who are you?</div>
            <div class="pinsub">Tap your name to see the schedule.</div>
            <div class="namegrid">
              ${kitchenNames.map(n2=>html`
                <button class=${'chip'+(localStorage.getItem('kit-me')===n2?' on':'')} key=${n2} onClick=${()=>pickLogin(n2)}>${n2}</button>`)}
            </div>
            ${kitchenNames.length===0&&html`<div class="empty">Loading the crew list…</div>`}
          `:html`
            <div class="whoami">${loginName}</div>
            <div class="pinsub">
              ${pinMode==='create'?'First time — pick a 4-digit PIN':
                pinMode==='confirm'?'Enter it again to confirm':
                'Enter your 4-digit PIN'}
            </div>
            <div class=${'dots'+(pinBad?' bad':'')}>${dots}</div>
            <div class="pad">
              ${[1,2,3,4,5,6,7,8,9].map(k=>html`<button class="key" key=${k} onClick=${()=>pressKey(String(k))}>${k}</button>`)}
              <button class="key ghostk" onClick=${()=>pickLogin(null)}>←</button>
              <button class="key" onClick=${()=>pressKey('0')}>0</button>
              <button class="key ghostk" onClick=${()=>pressKey('back')}>⌫</button>
            </div>
            ${pinBad&&pinMode==='enter'&&html`<div class="errline">Wrong PIN — try again</div>`}
            ${loginErr&&html`<div class="errline">${loginErr}</div>`}
            ${authBusy&&html`<div class="pinsub" style="margin:12px 0 0">Signing in…</div>`}
            <div style="text-align:center;margin-top:14px">
              ${pinMode==='enter'
                ?html`<button class="linkb" onClick=${()=>{setPinMode('create');setPinBuf('');setPinBad(false);setLoginErr('');setFirstPin('');}}>Set up a PIN (first time)</button>`
                :html`<button class="linkb" onClick=${()=>{setPinMode('enter');setPinBuf('');setPinBad(false);setLoginErr('');setFirstPin('');}}>Have a PIN? Enter it</button>`}
            </div>
            <div class="foot" style="margin-top:10px">Forgot your PIN? Ask a manager to reset it.</div>
          `}
        </div>
      </div>`;
  }

  return html`
    <div class="wrap">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div>
          <h1>🔪 Kitchen Schedule</h1>
          <div class="sub">GYRO CITY · READ ONLY — MANAGERS POST IT, YOU JUST CHECK IT</div>
        </div>
        <button class="logout" onClick=${logOut}>LOG OUT</button>
      </div>
      <div class="seg">
        <button class=${store==='astoria'?'on':''} onClick=${()=>pickStore('astoria')}>Astoria</button>
        <button class=${store==='macdougal'?'on':''} onClick=${()=>pickStore('macdougal')}>MacDougal</button>
      </div>
      <div class="seg" style="margin-top:0">
        <button class=${offset===0?'on':''} onClick=${()=>setOffset(0)}>This week · ${weekLabel(mondayOf(0))}</button>
        <button class=${offset===1?'on':''} onClick=${()=>setOffset(1)}>Next week</button>
      </div>
      ${kitchenNames.length>0&&html`
        <div class="chips">
          ${kitchenNames.map(n2=>html`
            <button class=${'chip'+(meName===n2?' on':'')} key=${n2} onClick=${()=>pickMe(n2)}>${n2}</button>`)}
        </div>`}
      ${!loaded&&!stuck&&html`<div class="empty">⏳ Loading the schedule…</div>`}
      ${!loaded&&stuck&&html`
        <div class="banner">Connection is being slow. <b style="cursor:pointer;text-decoration:underline" onClick=${()=>location.reload()}>Tap to reload.</b></div>`}
      ${loaded&&!published&&html`
        <div class="empty">📋 The ${offset===0?'':'next '}week\u2019s schedule isn\u2019t posted yet.<br/>Check back after the managers publish it.</div>`}
      ${loaded&&published&&(week.shifts||[]).length>0&&(week.shifts||[]).filter(s=>s.position==='cook'||s.position==='prep').length===0&&html`
        <div class="banner">
          <b>This week is posted with ${(week.shifts||[]).length} shift${(week.shifts||[]).length>1?'s':''} — but none are in the Line Cook or Prep rows.</b><br/>
          In the Managers Book schedule, kitchen shifts must be added under the LINE COOK / PREP sections (not Cashier/Expo) to appear here. Move them there and they’ll show instantly.
        </div>`}
      ${loaded&&published&&DAYS7.map((dn,di)=>{
        const cooks=kitchenShifts(di,'cook');
        const preps=kitchenShifts(di,'prep');
        return html`
          <div class=${'daycard'+(di===tIdx?' today':'')} key=${di}>
            <div class="dh">
              <b>${dn}</b>
              <span class="dd">${dayDate(monday,di)} ${di===tIdx?html`<span class="today-tag"> · TODAY</span>`:''}</span>
            </div>
            ${KITCHEN.map(([role,label,color])=>{
              const list=role==='cook'?cooks:preps;
              return html`
                <${Fragment} key=${role}>
                  <div class="roleh" style=${{color}}>${label}</div>
                  ${list.length===0&&html`<div class="off">no ${role} scheduled</div>`}
                  ${list.map(s=>{
                    const e=empById(s.empId);
                    const mine=e&&meName&&e.name===meName;
                    return html`
                      <div class=${'sh'+(mine?' me':'')} key=${s.id}>
                        <b>${e?e.name:'⚠ name missing'}</b>
                        <span class="t">${fmtTime(s.start)}–${fmtTime(s.end)}</span>
                      </div>`;
                  })}
                <//>`;
            })}
          </div>`;
      })}
      <div class="foot">Updates live the moment managers publish changes.<br/>Tap your name above to highlight your shifts.</div>
    </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
